; Keeps PHP errors in the server log instead of in the HTTP response.
;
; Without this, a warning or fatal in any served script is echoed straight into the
; page body -- the same disclosure 5.1 closed at the top level, but reached through
; every other script rather than only the catch block. display_errors is the setting
; that matters; log_errors is on so the detail is still recoverable server-side.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
