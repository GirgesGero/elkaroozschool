; Keeps PHP errors in the server log instead of in the HTTP response.
;
; Without this, a warning or fatal in any served script is echoed straight into the
; page body -- the same disclosure 5.1 closed at the top level, but reached through
; every other script rather than only the catch block. display_errors is the setting
; that matters; log_errors is on so the detail is still recoverable server-side.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Point this at the environment file. It MUST live OUTSIDE public_html --
; src/Utils/Environment.php refuses to load one that resolves inside the web
; document root. Replace the path below with your real home directory.
;
; Environment::load() never overrides a variable the host already sets, so a
; real host-level env var wins over this one. That is the safer setup: leave
; this commented and set ELKAROOZ_ENV_FILE in hPanel instead.
;
;ELKAROOZ_ENV_FILE=/home/CHANGE_ME/.elkarooz.env
