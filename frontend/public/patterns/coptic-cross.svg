<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="#c29938" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Central cross bars -->
  <line x1="50" y1="12" x2="50" y2="88" />
  <line x1="12" y1="50" x2="88" y2="50" />
  
  <!-- Coptic cross decorative three-point arms (Trinity points) -->
  <!-- Top arm -->
  <circle cx="50" cy="12" r="3" fill="#c29938" />
  <circle cx="43" cy="17" r="2.5" fill="#c29938" />
  <circle cx="57" cy="17" r="2.5" fill="#c29938" />
  
  <!-- Bottom arm -->
  <circle cx="50" cy="88" r="3" fill="#c29938" />
  <circle cx="43" cy="83" r="2.5" fill="#c29938" />
  <circle cx="57" cy="83" r="2.5" fill="#c29938" />
  
  <!-- Left arm -->
  <circle cx="12" cy="50" r="3" fill="#c29938" />
  <circle cx="17" cy="43" r="2.5" fill="#c29938" />
  <circle cx="17" cy="57" r="2.5" fill="#c29938" />
  
  <!-- Right arm -->
  <circle cx="88" cy="50" r="3" fill="#c29938" />
  <circle cx="83" cy="43" r="2.5" fill="#c29938" />
  <circle cx="83" cy="57" r="2.5" fill="#c29938" />
  
  <!-- Central rosette / ring -->
  <circle cx="50" cy="50" r="14" stroke="#c29938" stroke-width="1.8" />
  <circle cx="50" cy="50" r="4" fill="#c29938" />
  
  <!-- Diagonal rays -->
  <line x1="28" y1="28" x2="36" y2="36" stroke-width="1.5" />
  <line x1="72" y1="28" x2="64" y2="36" stroke-width="1.5" />
  <line x1="28" y1="72" x2="36" y2="64" stroke-width="1.5" />
  <line x1="72" y1="72" x2="64" y2="64" stroke-width="1.5" />
</svg>