name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend — types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The route-access matrix is the regression net for the middleware role gate, so
      # a red test here must fail the build rather than scroll past in a log.
      - name: Test
        run: npm test

      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  backend:
    name: Backend — PHP syntax, concurrency, deploy package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl, fileinfo
          coverage: none

      # The rate limiter's bug was a lost update under concurrency, which no
      # single-threaded check can catch: the counter read and the write both look
      # correct in isolation. It runs 24 real OS processes at one counter, and a
      # regression makes two of them observe the same value.
      - name: Rate limiter increment is atomic
        run: php scripts/verify_rate_limit_atomicity.php

      # Every IP the application stores or buckets on has to be a real address, never
      # whatever a caller typed into X-Forwarded-For.
      - name: Client IP cannot be forged by a header
        run: php scripts/verify_client_ip.php

      # The deployable archive, with its structural assertions (no secrets, web-root
      # guards present, every required class included). A packaging failure must break
      # the build, not wait for the next upload to a live host.
      - name: Deploy package builds and passes its assertions
        run: php scripts/package_zip.php

      # Real exploits against the restore and import paths, run as attacks rather than
      # assertions about the source: a zip slip, a decompression bomb, a member-count
      # bomb, and spreadsheet formula injection. A guard that exists but does not hold
      # fails this job.
      #
      # The bomb needs headroom over PHP's 128M default because the probe builds the
      # archive on disk but the service extracts it in memory.
      - name: Archive and spreadsheet attacks are blocked
        run: php -d memory_limit=512M scripts/verify_archive_attacks.php

      # No credential may live in tracked source or in the deployable archive. This was
      # a READY-gate item that had been signed off by reading files by hand, while
      # eleven tracked scripts carried a real Supabase anon key -- so it is now a
      # machine check rather than a habit.
      #
      # A committed key cannot be un-committed. This failing means the key is already in
      # history and in every existing clone: rotate it in Supabase, then purge.
      - name: No credential is committed
        run: python scripts/verify_no_credential_leaks.py
